name: Build and screenshot

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build iPhone app, widgets and watch app
        run: |
          set -o pipefail
          xcodebuild -project Tallyho.xcodeproj -scheme Tallyho \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(isolat|Sendable|deprecated)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true
          echo "---- tail ----"
          tail -60 build.log

      - name: Build watch app on its own
        run: |
          set -o pipefail
          xcodebuild -project Tallyho.xcodeproj -scheme "Tallyho Watch App" \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build-watch \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee watch.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch.log

      - name: Show watch errors
        if: failure()
        run: grep -E "error:" watch.log | sort -u | head -80 || true

      - name: Screenshots (iPhone)
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; phones=[x for k,v in d.items() if 'iOS-26-5' in k for x in v if x['name'].startswith('iPhone')]; pro=[x for x in phones if x['name']=='iPhone 17 Pro']; print((pro or phones)[0]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryLevel 100 --cellularBars 4 --wifiBars 3
          APP=$(find build/Build/Products -maxdepth 2 -name "Tallyho.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl spawn "$UDID" defaults read com.apple.Accessibility ReduceMotionEnabled || echo "ReduceMotionEnabled not set"
          mkdir -p shots
          shot () {
            name=$1; shift
            xcrun simctl terminate "$UDID" MMT.Tallyho 2>/dev/null || true
            xcrun simctl launch "$UDID" MMT.Tallyho -demo "$@"
            sleep ${WAIT:-4}
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 01-home-riso -theme riso
          shot 02-stage-riso -theme riso -screen stage
          shot 03-stage-down-nightshift -theme nightshift -screen stagedown
          shot 04-home-nightshift -theme nightshift
          shot 05-stage-free-chalk -theme chalk -screen stagefree
          WAIT=3 shot 06-celebrate-riso -theme riso -screen celebrate
          shot 07-editor-sorbet -theme sorbet -screen editor
          shot 08-settings-espresso -theme espresso -screen settings
          shot 09-themes-riso -theme riso -screen themes
          shot 10-finished-swiss -theme swiss -screen finished
          shot 11-home-split-blueprint -theme blueprint -split
          shot 12-home-ghost-citrus -theme citrus -ghost
          shot 13-stage-blueprint -theme blueprint -screen stage
          shot 14-stage-halloween -theme halloween -screen stage
          WAIT=3 shot 15-celebrate-christmas -theme christmas -screen celebrate
          shot 16-new-tally-nowruz -theme nowruz -screen new
          shot 17-archive-valentine -theme valentine -screen archive
          xcrun simctl ui "$UDID" appearance dark
          shot 18-home-espresso-dark -theme espresso
          xcrun simctl ui "$UDID" content_size accessibility-extra-large
          shot 19-home-riso-ax -theme riso
          shot 20-stage-riso-ax -theme riso -screen stage
          xcrun simctl ui "$UDID" content_size large
          xcrun simctl ui "$UDID" appearance light
          ls -la shots

      - name: Screenshots (Apple Watch)
        continue-on-error: true
        run: |
          set -x
          WUDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'watchOS-26-5' in k for x in v if 'Apple Watch' in x['name']))")
          xcrun simctl boot "$WUDID"
          xcrun simctl bootstatus "$WUDID" -b
          WAPP=$(find build-watch/Build/Products -maxdepth 2 -name "Tallyho Watch App.app" | head -1)
          xcrun simctl install "$WUDID" "$WAPP"
          xcrun simctl launch "$WUDID" MMT.Tallyho.watchkitapp -demo
          sleep 4
          xcrun simctl io "$WUDID" screenshot shots/30-watch-list.png
          xcrun simctl terminate "$WUDID" MMT.Tallyho.watchkitapp
          xcrun simctl launch "$WUDID" MMT.Tallyho.watchkitapp -demo -open
          sleep 4
          xcrun simctl io "$WUDID" screenshot shots/31-watch-counter.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
